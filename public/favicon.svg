<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ali's Reading App">
  <!--
    The bare mark from design/brandAssets.pdf. The "a" is drawn as geometry,
    not <text>: favicons render without any webfont, so Patrick Hand would
    silently fall back to whatever the OS supplies. Corner radius is ~19% of
    the square, per the asset sheet.
  -->
  <rect width="32" height="32" rx="6.1" fill="#1a1a1a"/>
  <circle cx="13.7" cy="19.6" r="4.05" fill="none" stroke="#ffffff" stroke-width="3.6"/>
  <rect x="16.1" y="12.9" width="3.5" height="12.5" rx="1.2" fill="#ffffff"/>
  <circle cx="23" cy="23" r="2.15" fill="#b4562f"/>
</svg>
